<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#03060f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:,">
<title>Phone Clock</title>
<style>
  :root {
    /* --W, --H, --u 는 스크립트가 실제 화면 크기(주소창 제외)로 계산해 넣습니다 */
    --W: 100vw; --H: 100vh; --u: 1vmin;
    --bg: #03060f;
    --fg: #e8f3ff;
    --dim: #7f93b5;
    --neon: #3fa9ff;
    --neon-2: #00e0ff;
    --warn: #ffb547;
    --err: #ff4d6d;
    --card-line: rgba(150,195,255,.16);
    --glow: 0 0 calc(.5 * var(--u)) rgba(63,169,255,.9), 0 0 calc(2.2 * var(--u)) rgba(63,169,255,.55), 0 0 calc(6 * var(--u)) rgba(40,110,255,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden;
    font-family: system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }

  /* ---------- 가로 고정: 세로로 들면 화면을 90도 회전 (전체화면에서는 기기 방향 자체를 가로로 잠금) ---------- */
  #app, #bg { position: fixed; left: 0; top: 0; width: var(--W); height: var(--H); }
  #app { z-index: 1; }
  body.rot #app, body.rot #bg { transform: rotate(90deg) translateY(-100%); transform-origin: top left; }
  body.night #grid { opacity: .32; }

  /* ---------- 배경: 고정된 블루 네온 빛 ---------- */
  /* 점 지구본 + 네트워크 선 이미지(bg.svg, tools/make_bg.py 로 생성) 위에 어두운 막을 덮어 은은하게 */
  #bg { overflow: hidden; z-index: 0; background: var(--bg) url(bg.svg) center / cover no-repeat; }
  #bg::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 35% 55%, rgba(2,6,16,.28) 0%, rgba(2,6,16,.55) 70%, rgba(2,5,12,.8) 100%); }

  /* ---------- 벤토 그리드 ----------
       [ 시계 ][ 날씨 ][ 아이콘 2x4 ]
       [ CPU · RAM   ][            ]                                  */
  #grid {
    width: 100%; height: 100%; padding: calc(2.6 * var(--u));
    display: grid; gap: calc(2 * var(--u));
    grid-template-columns: 1.55fr 1fr 1.3fr;
    grid-template-rows: 1fr calc(23 * var(--u));
    grid-template-areas: "clock weather keys" "stats stats keys";
    transform: translate(var(--sx, 0px), var(--sy, 0px)); transition: transform 3s ease, opacity 2s;
  }
  body.clock-only #grid { grid-template-columns: 1.6fr 1fr; grid-template-areas: "clock weather" "clock weather"; }
  body.clock-only #keys, body.clock-only #stats { display: none !important; }

  .card {
    position: relative; min-width: 0; min-height: 0; border-radius: calc(3.6 * var(--u));
    background: linear-gradient(150deg, rgba(160,205,255,.12), rgba(120,170,255,.04) 55%, rgba(10,25,60,.18));
    border: 1px solid rgba(170,210,255,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16), inset 0 0 calc(4 * var(--u)) rgba(63,169,255,.06),
                0 calc(1.2 * var(--u)) calc(5 * var(--u)) rgba(0,4,18,.6);
    -webkit-backdrop-filter: blur(7px) saturate(150%); backdrop-filter: blur(7px) saturate(150%);
    padding: calc(2.6 * var(--u)) calc(3.2 * var(--u));
  }
  .tag { position: absolute; top: calc(2.2 * var(--u)); left: calc(3 * var(--u));
         font-size: calc(2.3 * var(--u)); font-weight: 600; letter-spacing: .22em; color: rgba(0,224,255,.75); }

  /* 시계 */
  #clock { grid-area: clock; display: flex; flex-direction: column; justify-content: center; }
  #time { font-variant-numeric: tabular-nums; font-weight: 200; line-height: .9; white-space: nowrap;
          font-size: calc(30 * var(--u)); letter-spacing: -.035em; color: #f2f8ff; text-shadow: var(--glow); }
  body.clock-only #time { font-size: calc(40 * var(--u)); }
  #time .sec { font-size: .3em; color: var(--neon-2); margin-left: .08em; letter-spacing: 0; text-shadow: 0 0 calc(1.5 * var(--u)) rgba(0,224,255,.8); }
  #time .ampm { font-size: .22em; color: var(--dim); margin-right: .2em; text-shadow: none; }
  #date { margin-top: calc(2.4 * var(--u)); font-size: calc(5.4 * var(--u)); font-weight: 500; color: #a9d4ff; text-shadow: 0 0 calc(2 * var(--u)) rgba(63,169,255,.5); }
  #status { position: absolute; right: calc(3 * var(--u)); bottom: calc(2.4 * var(--u)); font-size: calc(2.2 * var(--u)); color: var(--dim);
            display: flex; align-items: center; gap: .5em; }
  #dot { width: .8em; height: .8em; border-radius: 50%; background: var(--dim); }
  #dot.ok { background: #3dffb0; box-shadow: 0 0 calc(1 * var(--u)) #3dffb0; } #dot.err { background: var(--err); box-shadow: 0 0 calc(1 * var(--u)) var(--err); }

  /* 날씨 */
  #weather { grid-area: weather; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: calc(1 * var(--u)); }
  #weather .row { display: flex; align-items: center; gap: calc(1.6 * var(--u)); margin-top: calc(2 * var(--u)); }
  #weather .wi { font-size: calc(13 * var(--u)); line-height: 1; filter: drop-shadow(0 0 calc(2 * var(--u)) rgba(255,200,80,.45)); }
  #weather .wt { font-size: calc(17 * var(--u)); font-weight: 200; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: var(--glow); }
  #weather .wn { font-size: calc(4.6 * var(--u)); font-weight: 600; color: #e3f0ff; }
  #weather .ws { font-size: calc(3.5 * var(--u)); color: #9fb6d8; line-height: 1.45; }
  #weather .ws b { color: #ffd27a; font-weight: 500; } #weather .ws i { font-style: normal; color: #7cc4ff; }

  /* CPU · RAM (축소형 계기판) */
  #stats { grid-area: stats; display: grid; grid-template-columns: 1fr 1px 1fr; align-items: center; gap: calc(3 * var(--u)); padding-top: calc(1.6 * var(--u)); padding-bottom: calc(1.6 * var(--u)); }
  #stats .sep { height: 70%; background: var(--card-line); }
  .meter { display: flex; align-items: center; gap: calc(2.6 * var(--u)); min-width: 0; }
  .gauge { position: relative; width: calc(19 * var(--u)); height: calc(19 * var(--u)); flex: none; }
  .gauge svg { width: 100%; height: 100%; overflow: visible; }
  .gauge .track { fill: none; stroke: rgba(120,170,255,.14); stroke-width: 9; stroke-linecap: round; }
  .gauge .val { fill: none; stroke: url(#gNeon); stroke-width: 9; stroke-linecap: round;
                filter: drop-shadow(0 0 3px rgba(63,169,255,.9)) drop-shadow(0 0 8px rgba(63,169,255,.55));
                transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke .6s; }
  .meter.mid  .val { stroke: var(--warn); filter: drop-shadow(0 0 3px rgba(255,181,71,.9)); }
  .meter.high .val { stroke: var(--err);  filter: drop-shadow(0 0 3px rgba(255,77,109,.9)); }
  .gauge .ticks line { stroke: rgba(170,210,255,.45); stroke-width: 1.4; }
  .gauge .needle { stroke: #fff; stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--neon-2));
                   transition: transform .9s cubic-bezier(.2,.8,.2,1); transform-origin: 60px 60px; }
  .gauge .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
                font-size: calc(3.7 * var(--u)); font-weight: 400; font-variant-numeric: tabular-nums; text-shadow: var(--glow); padding-top: calc(.6 * var(--u)); }
  .meter .txt { display: flex; flex-direction: column; gap: calc(.6 * var(--u)); min-width: 0; }
  .meter .nm { font-size: calc(3.4 * var(--u)); font-weight: 700; letter-spacing: .2em; color: var(--neon-2); text-shadow: 0 0 calc(1.4 * var(--u)) rgba(0,224,255,.6); }
  .meter .sub { font-size: calc(2.8 * var(--u)); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 아이콘: 2 x 4 벤토 칸 (글래스모피즘) */
  #keys { grid-area: keys; display: grid; grid-template-columns: 1fr 1fr; gap: calc(2 * var(--u)); min-height: 0; }
  .key {
    position: relative; min-width: 0; min-height: 0; padding: 0 calc(2 * var(--u)); cursor: pointer;
    display: flex; align-items: center; gap: calc(1.8 * var(--u));
    border-radius: calc(3.2 * var(--u)); font: inherit; color: var(--fg); text-align: left;
    background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.04) 55%, rgba(120,170,255,.07));
    border: 1px solid rgba(190,220,255,.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.25), 0 calc(1 * var(--u)) calc(3 * var(--u)) rgba(0,8,30,.5);
    -webkit-backdrop-filter: blur(8px) saturate(160%); backdrop-filter: blur(8px) saturate(160%);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .key, .card { background: rgba(28,42,78,.78); }
  }
  .key > * { pointer-events: none; }
  .key::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
                 background: linear-gradient(165deg, rgba(255,255,255,.2) 0%, rgba(255,255,255,0) 40%); }
  .key .ic { position: relative; flex: none; font-size: calc(8 * var(--u)); line-height: 1; filter: drop-shadow(0 calc(.6 * var(--u)) calc(1.2 * var(--u)) rgba(0,0,0,.45)); }
  .key .ic img { width: calc(8.4 * var(--u)); height: calc(8.4 * var(--u)); object-fit: contain; display: block; }
  .key .lb { position: relative; font-size: calc(2.85 * var(--u)); font-weight: 500; color: #e1eeff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 클릭 효과: 테두리 네온 라이트 + 방울 튕김 + 물결 */
  .key .fx { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .key .ring { position: absolute; inset: 0; border-radius: inherit; opacity: 0;
               box-shadow: inset 0 0 0 2px var(--neon-2), inset 0 0 calc(2.4 * var(--u)) rgba(0,224,255,.55), 0 0 calc(3 * var(--u)) rgba(0,224,255,.8); }
  .key.lit .ring { animation: ring .9s ease-out; }
  .key.err .ring { box-shadow: inset 0 0 0 2px var(--err), inset 0 0 calc(2.4 * var(--u)) rgba(255,77,109,.5), 0 0 calc(3 * var(--u)) rgba(255,77,109,.8); animation: ring .9s ease-out; }
  @keyframes ring { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .key.pop { animation: jelly .65s cubic-bezier(.3,.7,.4,1.4); }
  @keyframes jelly {
    0% { transform: scale(1,1); } 18% { transform: scale(.88,.84); } 40% { transform: scale(1.06,1.1); }
    58% { transform: scale(.97,.95); } 76% { transform: scale(1.01,1.03); } 100% { transform: scale(1,1); }
  }
  .ripple { position: absolute; width: calc(10 * var(--u)); height: calc(10 * var(--u)); margin: calc(-5 * var(--u)) 0 0 calc(-5 * var(--u));
            border-radius: 50%; pointer-events: none;
            background: radial-gradient(circle, rgba(140,230,255,.65) 0%, rgba(63,169,255,.25) 45%, rgba(63,169,255,0) 70%);
            animation: drop .7s ease-out forwards; }
  @keyframes drop { from { transform: scale(0); opacity: 1; } to { transform: scale(5); opacity: 0; } }

  /* 안내 문구 / 토스트 */
  .pill { position: absolute; left: 50%; bottom: calc(3 * var(--u)); transform: translateX(-50%); z-index: 5; white-space: nowrap;
          background: rgba(14,26,56,.85); border: 1px solid rgba(120,200,255,.35); color: #cfe9ff;
          padding: calc(1.2 * var(--u)) calc(2.8 * var(--u)); border-radius: 99px; font-size: calc(2.8 * var(--u));
          -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); pointer-events: none; transition: opacity .4s; }
  #fsHint { box-shadow: 0 0 calc(2 * var(--u)) rgba(0,224,255,.35); }
  #fsHint[hidden] { display: block; opacity: 0; }
  #msg:not(.show) { opacity: 0; }
  #msg { bottom: auto; top: calc(3 * var(--u)); }
</style>
</head>
<body>
<div id="bg"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gNeon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a5cff"/><stop offset=".5" stop-color="#3fa9ff"/><stop offset="1" stop-color="#00e0ff"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">
  <div id="grid">
    <section class="card" id="clock" title="두 번 탭: 시계만 보기">
      <div id="time">--:--</div>
      <div id="date"></div>
      <div id="status"><span id="dot"></span><span id="stxt">연결 확인 중</span></div>
    </section>

    <section class="card" id="weather">
      <span class="tag">WEATHER</span>
      <div class="row"><span class="wi">·</span><span class="wt">--°</span></div>
      <div class="wn">날씨 불러오는 중</div>
      <div class="ws"></div>
    </section>

    <section class="card" id="stats">
      <div class="meter" id="m-cpu"></div>
      <div class="sep"></div>
      <div class="meter" id="m-ram"></div>
    </section>

    <section id="keys"></section>
  </div>
  <div class="pill" id="fsHint" hidden>화면을 한 번 터치하면 전체화면으로 전환됩니다</div>
  <div class="pill" id="msg"></div>
</div>

<script>
(() => {
  // ---------- 화면 크기: 주소창을 뺀 실제 보이는 영역 기준으로 계산
  const root = document.documentElement;
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    const rot = h > w;                       // 세로로 들고 있으면 화면을 돌려서 가로 배치 유지
    const W = rot ? h : w, H = rot ? w : h;
    root.style.setProperty('--W', W + 'px');
    root.style.setProperty('--H', H + 'px');
    root.style.setProperty('--u', Math.min(H / 100, W / 200) + 'px');
    document.body.classList.toggle('rot', rot);
  }
  addEventListener('resize', () => { fit(); requestAnimationFrame(() => window.fitLabels?.()); });
  screen.orientation?.addEventListener?.('change', () => setTimeout(fit, 100));
  fit();

  // ---------- 전체화면 + 가로 고정 (브라우저 정책상 터치가 있어야만 가능)
  const $fs = document.getElementById('fsHint');
  const canFS = !!document.documentElement.requestFullscreen;
  const isApp = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
  function updateHint() { $fs.hidden = !canFS || isApp || !!document.fullscreenElement; }
  async function goFullscreen() {
    if (!canFS || isApp || document.fullscreenElement) return;
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
      await screen.orientation?.lock?.('landscape');
    } catch (e) {}
  }
  document.addEventListener('pointerdown', goFullscreen, true);
  document.addEventListener('fullscreenchange', () => { updateHint(); setTimeout(fit, 150); });
  updateHint();

  // ---------- 토큰(Wi-Fi 접속용): URL ?token=... 으로 한 번 열면 기억
  const qs = new URLSearchParams(location.search);
  if (qs.get('token')) {
    localStorage.setItem('pc_token', qs.get('token'));
    history.replaceState(null, '', location.pathname);
  }
  const token = localStorage.getItem('pc_token') || '';
  const api = (path, opt = {}) =>
    fetch(path, { ...opt, headers: { 'X-Token': token, ...(opt.headers || {}) } })
      .then(r => r.json().then(j => ({ status: r.status, ...j })));

  // ---------- 시계
  let cfg = { show_seconds: true, hour12: false, night_dim_from: 22, night_dim_to: 7 };
  const $time = document.getElementById('time'), $date = document.getElementById('date');
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  const pad = n => String(n).padStart(2, '0');
  function tick() {
    const d = new Date(), H = d.getHours();
    let h = H, ampm = '';
    if (cfg.hour12) { ampm = `<span class="ampm">${h < 12 ? '오전' : '오후'}</span>`; h = h % 12 || 12; }
    const sec = cfg.show_seconds ? `<span class="sec">${pad(d.getSeconds())}</span>` : '';
    $time.innerHTML = `${ampm}${cfg.hour12 ? h : pad(h)}:${pad(d.getMinutes())}${sec}`;
    $date.textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`;
    const f = cfg.night_dim_from, t = cfg.night_dim_to;
    const night = f == null ? false : (f > t ? (H >= f || H < t) : (H >= f && H < t));
    document.body.classList.toggle('night', night);
    if (d.getSeconds() === 0) {   // 번인 방지: 1분마다 전체를 몇 px 이동
      const g = document.getElementById('grid');
      g.style.setProperty('--sx', (Math.random() * 8 - 4).toFixed(1) + 'px');
      g.style.setProperty('--sy', (Math.random() * 8 - 4).toFixed(1) + 'px');
    }
    setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
  }

  // ---------- PC 연결 상태
  const $dot = document.getElementById('dot'), $stxt = document.getElementById('stxt');
  function setStatus(ok, text) { $dot.className = ok ? 'ok' : 'err'; $stxt.textContent = text; }
  async function loadConfig() {
    try {
      const j = await api('/api/config');
      if (j.status === 401) return setStatus(false, '인증 필요 — PC의 Wi-Fi 주소(토큰 포함)로 접속');
      cfg = { ...cfg, ...j.clock };
      renderKeys(j.actions || []);
      setupWidgets(j);
      setStatus(true, 'PC 연결됨');
    } catch (e) {
      setStatus(false, 'PC 연결 끊김');
    }
  }

  // ---------- 날씨
  const WMO = {
    0: ['맑음', '☀️', '🌙'], 1: ['대체로 맑음', '🌤️', '🌙'], 2: ['구름 조금', '⛅', '☁️'], 3: ['흐림', '☁️'],
    45: ['안개', '🌫️'], 48: ['안개', '🌫️'],
    51: ['이슬비', '🌦️'], 53: ['이슬비', '🌦️'], 55: ['이슬비', '🌧️'], 56: ['어는 이슬비', '🌧️'], 57: ['어는 이슬비', '🌧️'],
    61: ['약한 비', '🌧️'], 63: ['비', '🌧️'], 65: ['강한 비', '🌧️'], 66: ['어는 비', '🌧️'], 67: ['어는 비', '🌧️'],
    71: ['약한 눈', '🌨️'], 73: ['눈', '🌨️'], 75: ['많은 눈', '❄️'], 77: ['싸락눈', '🌨️'],
    80: ['소나기', '🌦️'], 81: ['소나기', '🌧️'], 82: ['강한 소나기', '⛈️'], 85: ['소낙눈', '🌨️'], 86: ['소낙눈', '❄️'],
    95: ['뇌우', '⛈️'], 96: ['우박 뇌우', '⛈️'], 99: ['우박 뇌우', '⛈️'],
  };
  const $w = document.getElementById('weather');
  async function loadWeather() {
    try {
      const j = await api('/api/weather');
      if (!j.ok || !j.weather) return;
      const w = j.weather, m = WMO[w.code] || ['', '🌡️'];
      $w.querySelector('.tag').textContent = `WEATHER · ${w.name}`;
      $w.querySelector('.wi').textContent = (!w.is_day && m[2]) ? m[2] : m[1];
      $w.querySelector('.wt').textContent = `${Math.round(w.temp)}°`;
      $w.querySelector('.wn').textContent = `${m[0]} · 체감 ${Math.round(w.feels)}°`;
      $w.querySelector('.ws').innerHTML =
        `<b>↑ ${Math.round(w.max)}°</b>&nbsp; <i>↓ ${Math.round(w.min)}°</i><br>강수 ${w.pop ?? 0}% · 습도 ${w.humidity}%`;
    } catch (e) {}
  }

  // ---------- CPU · RAM 계기판 (아래가 열린 270° 원호)
  const SWEEP = 270, START = 135, C = 60;
  const polar = (deg, r) => { const a = deg * Math.PI / 180; return [C + r * Math.cos(a), C + r * Math.sin(a)]; };
  const arc = r => { const [x1, y1] = polar(START, r), [x2, y2] = polar(START + SWEEP, r); return `M ${x1} ${y1} A ${r} ${r} 0 1 1 ${x2} ${y2}`; };
  function meterHTML(label) {
    let ticks = '';
    for (let i = 0; i <= 10; i++) {
      const deg = START + SWEEP * i / 10, [x1, y1] = polar(deg, 34), [x2, y2] = polar(deg, 39);
      ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    }
    const [a, b] = polar(START, 29), [c, d] = polar(START, 39);
    return `<div class="gauge"><svg viewBox="0 0 120 120">
        <path class="track" d="${arc(50)}" pathLength="100"/>
        <path class="val" d="${arc(50)}" pathLength="100" stroke-dasharray="0 100"/>
        <g class="ticks">${ticks}</g>
        <line class="needle" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>
      </svg><div class="pct">-</div></div>
      <div class="txt"><div class="nm">${label}</div><div class="sub"></div></div>`;
  }
  document.getElementById('m-cpu').innerHTML = meterHTML('CPU');
  document.getElementById('m-ram').innerHTML = meterHTML('RAM');
  function setMeter(id, v, sub) {
    v = Math.max(0, Math.min(100, v));
    const el = document.getElementById(id);
    el.querySelector('.val').setAttribute('stroke-dasharray', `${v} 100`);
    el.querySelector('.needle').style.transform = `rotate(${SWEEP * v / 100}deg)`;
    el.querySelector('.pct').textContent = Math.round(v) + '%';
    el.querySelector('.sub').textContent = sub;
    el.classList.toggle('mid', v >= 60 && v < 85);
    el.classList.toggle('high', v >= 85);
  }
  async function loadStats() {
    try {
      const j = await api('/api/stats');
      if (!j.ok) return;
      setMeter('m-cpu', j.cpu, '프로세서 사용률');
      setMeter('m-ram', j.ram, `${j.ram_used_gb} / ${j.ram_total_gb} GB`);
    } catch (e) {}
  }

  let wTimer, sTimer, widgetSig = '';
  function setupWidgets(j) {
    const sig = [j.weather, j.weather_refresh_min, j.pc_stats, j.stats_refresh_sec].join();
    if (sig === widgetSig) return;
    widgetSig = sig;
    clearInterval(wTimer); clearInterval(sTimer);
    $w.style.display = j.weather ? '' : 'none';
    document.getElementById('stats').style.display = j.pc_stats ? '' : 'none';
    if (j.weather) { loadWeather(); wTimer = setInterval(loadWeather, Math.max(5, j.weather_refresh_min) * 60000); }
    if (j.pc_stats) { loadStats(); sTimer = setInterval(loadStats, Math.max(1, j.stats_refresh_sec) * 1000); }
  }

  // ---------- 단축키 (글래스모피즘 벤토 칸)
  const $keys = document.getElementById('keys');
  let lastSig = '';
  function renderKeys(actions) {
    const sig = JSON.stringify(actions);
    if (sig === lastSig) return;
    lastSig = sig;
    $keys.innerHTML = '';
    $keys.style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(actions.length / 2))}, 1fr)`;
    for (const a of actions) {
      const b = document.createElement('button');
      b.className = 'key';
      b.innerHTML = `<span class="fx"></span><span class="ring"></span><span class="ic"></span><span class="lb"></span>`;
      const ic = b.querySelector('.ic');
      if (a.img) {
        const img = document.createElement('img');
        img.src = a.img; img.alt = '';
        img.onerror = () => { ic.textContent = a.icon || '⌨️'; };
        ic.appendChild(img);
      } else {
        ic.textContent = a.icon || '⌨️';
      }
      b.querySelector('.lb').textContent = a.label || a.id;
      b.addEventListener('pointerdown', e => press(b, e));
      b.addEventListener('click', () => run(a, b));
      $keys.appendChild(b);
    }
    requestAnimationFrame(fitLabels);
  }
  // 긴 이름은 칸에 맞게 글자 크기를 줄임 (최소 65%)
  window.fitLabels = fitLabels;
  function fitLabels() {
    document.querySelectorAll('.key .lb').forEach(el => {
      el.style.fontSize = '';
      let scale = 1;
      const base = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth + 1 && scale > .65) { scale -= .05; el.style.fontSize = base * scale + 'px'; }
    });
  }
  function restart(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function press(btn, e) {
    restart(btn, 'pop');
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.left = (e.offsetX ?? btn.clientWidth / 2) + 'px';
    r.style.top = (e.offsetY ?? btn.clientHeight / 2) + 'px';
    btn.querySelector('.fx').appendChild(r);
    r.addEventListener('animationend', () => r.remove());
    btn.classList.remove('err');
    restart(btn, 'lit');
  }
  async function run(a, btn) {
    if (navigator.vibrate) navigator.vibrate(15);
    try {
      const j = await api('/api/run/' + encodeURIComponent(a.id), { method: 'POST' });
      if (!j.ok) { fail(btn); toast(`실패: ${j.error || j.status}`); }
    } catch (e) { fail(btn); toast('PC에 연결할 수 없습니다'); }
  }
  function fail(btn) { btn.classList.remove('lit'); restart(btn, 'err'); }
  document.addEventListener('animationend', e => {
    const k = e.target.closest?.('.key');
    if (!k) return;
    if (e.animationName === 'jelly') k.classList.remove('pop');
    if (e.animationName === 'ring') k.classList.remove('lit', 'err');
  });
  let toastT;
  function toast(t) {
    const m = document.getElementById('msg');
    m.textContent = t; m.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => m.classList.remove('show'), 2500);
  }

  // ---------- 화면 꺼짐 방지 (localhost/HTTPS 에서만 동작)
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
  document.addEventListener('pointerdown', keepAwake);

  // ---------- 시계 두 번 탭 = 시계만 보기
  let lastTap = 0;
  document.getElementById('clock').addEventListener('click', () => {
    const now = Date.now();
    if (now - lastTap < 350) {
      document.body.classList.toggle('clock-only');
      localStorage.setItem('clock_only', document.body.classList.contains('clock-only') ? '1' : '');
    }
    lastTap = now;
  });
  if (localStorage.getItem('clock_only')) document.body.classList.add('clock-only');

  tick();
  keepAwake();
  loadConfig();
  setInterval(loadConfig, 15000);
})();
</script>
</body>
</html>
